<title>Sợi Clothing Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: soft and cute. Warm white base, one blush accent, rounded everything, gentle shadows.
   Mobile first: one column, big tap targets, floating Zalo button. */
:root {
  color-scheme: light;
  --paper: #fffaf8;
  --cream: #fbf3ef;
  --blush: #f8dfe4;
  --rose: #e48a9d;
  --ink: #5a4a52;
  --muted: #8f8086;
  --line: #f0e2e4;
  --zalo: #0068ff;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 26px;
  --shadow: 0 8px 24px rgba(160, 110, 120, .12);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 120px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--blush); }
a { color: inherit; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.small { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: transform .15s, box-shadow .15s, background .15s; min-height: 48px; }
.btn:hover { transform: translateY(-2px); }
.btn-rose { background: var(--rose); color: #fff; box-shadow: 0 8px 20px rgba(228, 138, 157, .35); }
.btn-ink { background: var(--ink); color: var(--paper); }
.btn-ink:hover { background: var(--rose); }
.btn-ink:disabled { opacity: .4; cursor: not-allowed; transform: none; background: var(--ink); }
.btn-soft { background: var(--blush); color: var(--ink); }
.btn-zalo { background: var(--zalo); color: #fff; box-shadow: 0 8px 20px rgba(0, 104, 255, .25); }
.btn-block { width: 100%; }
.link { color: var(--rose); font-weight: 700; text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }

/* ── Shopify section: announcement-bar ── */
.ticker { background: var(--blush); color: var(--ink); overflow: hidden; white-space: nowrap; padding-block: 7px; }
.ticker-track { display: inline-flex; gap: 40px; animation: scroll 40s linear infinite; padding-left: 40px; }
.ticker span { font-size: .8rem; font-weight: 600; }
@keyframes scroll { to { transform: translateX(-50%); } }

/* ── Shopify section: header ── */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 250, 248, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.header-row { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; color: var(--ink); text-decoration: none; line-height: 1; }
.logo i { font-style: normal; color: var(--rose); font-size: .8em; margin-left: 2px; }
.nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.nav a { padding: 8px 14px; border-radius: 999px; font-weight: 700; white-space: nowrap; color: var(--muted); text-decoration: none; transition: background .15s, color .15s; }
.nav a:hover { color: var(--ink); background: var(--cream); }
.nav a.active { background: var(--blush); color: var(--ink); }
.nav a.ws { color: var(--rose); }
.cart-btn { border: none; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-weight: 700; display: flex; gap: 8px; align-items: center; transition: transform .15s; }
.cart-btn.bump { animation: bump .4s ease; }
@keyframes bump { 40% { transform: scale(1.1); } }
.cart-count { background: var(--rose); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: .75rem; padding: 0 6px; }

/* ── Shopify section: hero (image-banner) ── */
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; padding-block: 56px 32px; }
.pill { display: inline-flex; gap: 6px; align-items: center; background: var(--blush); color: var(--ink); font-weight: 700; font-size: .85rem; padding: 6px 14px; border-radius: 999px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.5rem, 6.5vw, 4.4rem); line-height: 1.05; margin: 14px 0 14px; }
.hero h1 em { font-style: normal; color: var(--rose); }
.hero-grid > div { min-width: 0; }
.hero p { font-size: 1.1rem; max-width: 36ch; margin: 0 0 24px; color: var(--muted); }
.hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; }
.collage { position: relative; height: 380px; max-width: 100%; }
.blob { position: absolute; inset: 8% 6%; background: var(--blush); border-radius: 46% 54% 52% 48% / 55% 45% 55% 45%; }
.tile { position: absolute; width: 44%; aspect-ratio: 1; max-width: 100%; background: var(--paper); border-radius: var(--radius); display: grid; place-items: center; box-shadow: var(--shadow); animation: float 6s ease-in-out infinite; }
.tile svg { width: 62%; height: 62%; }
.tile:nth-child(2) { left: 4%; top: 10%; rotate: -6deg; }
.tile:nth-child(3) { right: 4%; top: 2%; rotate: 5deg; animation-delay: -2s; }
.tile:nth-child(4) { left: 30%; bottom: 2%; rotate: -1deg; animation-delay: -4s; }
.sparkle { position: absolute; color: var(--rose); font-size: 1.4rem; animation: twinkle 2.4s ease-in-out infinite; }
.sparkle.s1 { top: 4%; left: 48%; }
.sparkle.s2 { bottom: 18%; right: 4%; animation-delay: -1.2s; font-size: 1rem; }
@keyframes float { 50% { translate: 0 -10px; } }
@keyframes twinkle { 50% { opacity: .3; transform: scale(.8); } }

/* Retail & wholesale strip */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mode { background: var(--cream); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; transition: background .2s, transform .2s; }
.mode:hover { background: var(--blush); transform: translateY(-2px); }
.mode strong { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.mode span { color: var(--muted); font-size: .95rem; }

/* ── Sections ── */
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; padding-block: 44px 16px; flex-wrap: wrap; }
.section-head h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 3.6vw, 2.3rem); margin: 0; line-height: 1.1; }
.section-head .sub { display: block; color: var(--muted); font-size: .9rem; font-weight: 600; }

/* ── Shopify section: featured-collection (product grid) ── */
.grid { display: grid; gap: 24px 18px; grid-template-columns: repeat(4, 1fr); }
.grid.all { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); padding-bottom: 56px; }
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 23%); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: thin; }
.row-scroll .card { scroll-snap-align: start; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 8px; text-decoration: none; }
.card-img { position: relative; aspect-ratio: 4 / 5; max-width: 100%; width: 100%; background: var(--cream); border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; transition: transform .2s, box-shadow .2s; }
.card:hover .card-img { transform: translateY(-4px); box-shadow: var(--shadow); }
.card-img svg { width: 56%; height: 56%; transition: transform .3s; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card:hover .card-img svg { transform: rotate(-4deg) scale(1.04); }
.badge { position: absolute; top: 12px; left: 12px; background: var(--paper); color: var(--rose); font-size: .72rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
.card h3 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.3; padding-inline: 4px; }
.price { font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; padding-inline: 4px; }
.dots { display: flex; gap: 6px; padding-inline: 4px; }
.dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(90, 74, 82, .2); }

/* ── Wholesale banner ── */
.ws-banner { margin-top: 56px; background: var(--blush); border-radius: var(--radius); padding: 36px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: center; }
.ws-banner h2 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.05; margin: 6px 0 10px; }
.ws-banner p { margin: 0; color: var(--ink); max-width: 46ch; }
.ws-actions { display: flex; flex-direction: column; gap: 10px; }

/* ── Contact / Zalo ── */
.contact { margin-block: 56px 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.contact h2 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.1; margin: 0 0 8px; }
.contact p { margin: 0 0 18px; color: var(--muted); }
.info { background: var(--cream); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; }
.info div { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: 12px; }
.info div:last-child { border-bottom: none; padding-bottom: 0; }
.info dt { font-weight: 700; margin: 0; }
.info dd { margin: 0; color: var(--muted); }
.todo { color: var(--rose); font-style: italic; }

/* ── Breadcrumb / page head ── */
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); padding-top: 20px; }
.crumbs a { text-decoration: none; font-weight: 600; }
.crumbs a:hover { color: var(--rose); }

/* ── Shopify section: main-product ── */
.pdp { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; padding-block: 20px 64px; align-items: start; }
.gallery { display: grid; gap: 12px; min-width: 0; }
.main-img { position: relative; aspect-ratio: 4 / 5; max-width: 100%; background: var(--cream); border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; }
.main-img svg { width: 58%; height: 58%; }
.main-img img { width: 100%; height: 100%; object-fit: cover; }
.ph-note { position: absolute; bottom: 12px; left: 50%; translate: -50% 0; background: var(--paper); color: var(--muted); font-size: .75rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.thumb { aspect-ratio: 1; max-width: 100%; border: 2px solid transparent; background: var(--cream); border-radius: 16px; display: grid; place-items: center; padding: 0; overflow: hidden; }
.thumb svg { width: 60%; height: 60%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.selected { border-color: var(--rose); }
.buy { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.buy h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.1; margin: 0; }
.code { color: var(--muted); font-size: .85rem; font-weight: 600; }
.retail { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.retail strong { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.retail span { color: var(--muted); font-size: .9rem; }
.label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 6px; }
.options { display: flex; gap: 8px; flex-wrap: wrap; }
.size { border: 1.5px solid var(--line); background: var(--paper); min-width: 52px; min-height: 44px; padding: 8px 12px; border-radius: 14px; font-weight: 700; transition: border-color .15s, background .15s; }
.size:hover { border-color: var(--rose); }
.size.selected { background: var(--blush); border-color: var(--rose); }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: none; box-shadow: inset 0 0 0 1px rgba(90, 74, 82, .2); }
.swatch.selected { box-shadow: inset 0 0 0 1px rgba(90, 74, 82, .2), 0 0 0 3px var(--paper), 0 0 0 5px var(--rose); }
.desc { color: var(--ink); margin: 4px 0 0; }
.buy-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.ws-box { margin-top: 10px; border: 1.5px dashed var(--rose); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
.ws-box strong { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.1; }
.ws-box p { margin: 0; color: var(--muted); font-size: .95rem; }

/* ── Wholesale page ── */
.ws-head { background: var(--blush); border-radius: var(--radius); padding: 40px 32px; margin-top: 16px; }
.ws-head h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 5.5vw, 3.6rem); line-height: 1.05; margin: 10px 0 12px; }
.ws-head p { margin: 0 0 22px; max-width: 52ch; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
.steps li { background: var(--cream); border-radius: var(--radius); padding: 22px; counter-increment: s; }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--rose); color: #fff; font-weight: 700; margin-bottom: 10px; }
.steps strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
.steps span { color: var(--muted); font-size: .95rem; }
.ws-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 64px; }
.ws-cat { background: var(--cream); border-radius: var(--radius); padding: 18px 20px; display: flex; align-items: center; gap: 14px; text-decoration: none; transition: background .2s; }
.ws-cat:hover { background: var(--blush); }
.ws-cat svg { width: 52px; height: 52px; flex-shrink: 0; }
.ws-cat strong { display: block; font-size: 1.1rem; }
.ws-cat span { color: var(--muted); font-size: .85rem; }

/* ── Shopify section: cart-drawer ── */
.overlay { position: fixed; inset: 0; background: rgba(90, 74, 82, .3); backdrop-filter: blur(2px); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(400px, 100vw); background: var(--paper); border-radius: var(--radius) 0 0 var(--radius); display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(90, 74, 82, .15); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); animation: slide .25s ease; }
@keyframes slide { from { transform: translateX(100%); } }
.drawer-head { position: relative; padding: 22px 24px 12px; }
.drawer-head h2 { font-family: var(--font-display); font-weight: 700; margin: 0; font-size: 1.5rem; }
.close { position: absolute; top: 14px; right: 16px; border: none; background: transparent; font-size: 1.9rem; line-height: 1; color: var(--muted); width: 44px; height: 44px; }
.cart-items { list-style: none; margin: 0; padding: 0 24px; flex: 1; overflow-y: auto; }
.cart-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cart-thumb { width: 60px; height: 60px; background: var(--cream); border-radius: 16px; display: grid; place-items: center; flex-shrink: 0; overflow: hidden; }
.cart-thumb svg { width: 62%; height: 62%; }
.cart-meta { flex: 1; min-width: 0; font-weight: 700; font-size: .95rem; }
.cart-meta small { display: block; color: var(--muted); font-weight: 400; font-size: .8rem; }
.qty { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 700; }
.qty button { width: 32px; height: 32px; border: none; background: var(--cream); border-radius: 50%; }
.qty button:hover { background: var(--blush); }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.drawer-foot { padding: 18px 24px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; }
.foot-note { color: var(--muted); font-size: .82rem; margin: 0; }

/* ── Floating Zalo button ── */
.zalo-float { position: fixed; z-index: 25; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; background: var(--zalo); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 18px; border-radius: 999px; box-shadow: 0 10px 24px rgba(0, 104, 255, .35); }
.zalo-float b { background: #fff; color: var(--zalo); border-radius: 8px; padding: 0 6px; font-size: .8rem; }

/* ── Shopify section: footer ── */
.footer { background: var(--cream); padding-block: 32px 96px; }
.footer-row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
.footer p { margin: 0; color: var(--muted); font-size: .85rem; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 40; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 860px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
  .row-scroll { grid-auto-columns: 44%; gap: 12px; }
  .pdp { grid-template-columns: 1fr; gap: 20px; }
  .ws-banner, .contact { grid-template-columns: 1fr; }
  .steps, .ws-cats { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .header-row { flex-wrap: wrap; gap: 6px; }
  .logo { flex: 1; }
  .nav { order: 3; flex-basis: 100%; justify-content: space-between; gap: 2px; }
  .nav a { padding: 8px 10px; font-size: .95rem; }
  .hero-grid { grid-template-columns: 1fr; padding-block: 28px 8px; gap: 20px; }
  .collage { height: 250px; }
  .hero-ctas .btn { flex: 1; }
  .modes { grid-template-columns: 1fr; gap: 10px; }
  .grid.all { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
  .ws-banner { padding: 26px 22px; }
  .ws-head { padding: 28px 22px; }
  .buy-actions { grid-template-columns: 1fr; }
  .zalo-float span { display: none; }
}
</style>

<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<main id="app"></main>

<footer class="footer">

<script>
/* =====================================================================
   1. THÔNG TIN SHOP — điền thông tin thật vào đây
   ===================================================================== */
const SHOP = {
  zalo: "",                      // Số Zalo, ví dụ "0901234567". Để trống = hiện "đang cập nhật"

      <p>Liên hệ chúng tôi để nhận giá sỉ và số lượng đặt tối thiểu. Giá sỉ <span class="todo">đang cập nhật</span> trên website.</p>
    </div>

    <div class="section-head"><h2>Danh mục bán sỉ</h2></div>
    <div class="ws-cats">${CATS.map((c) => `<a class="ws-cat" href="#${c.slug}">${ICONS[c.icon](c.color)}<span><strong>${c.type}</strong><span>${PRODUCTS.filter((p) => p.product_type === c.type).length} mẫu · Xem tất cả →</span></span></a>`).join("")}</div>
  </section>
  ${contactSection()}`;
}

function productPage(p) {
  const cat = catOf(p);
  return `<section class="wrap">
    <nav class="crumbs" aria-label="Đường dẫn"><a href="#">Trang chủ</a><span>/</span><a href="#${cat.slug}">${cat.type}</a><span>/</span><span>${p.title}</span></nav>
    <div class="pdp" id="pdp"></div>
  </section>`;
}

/* Product page body: re-renders when color / size / photo changes */
function mountProduct(p) {
  let color = colorsOf(p)[0], size = null, shot = 0;
  const render = () => {
    const variant = size && p.variants.find((v) => v.option1 === color && v.option2 === size);
    const photos = p.images.length
      ? p.images.map((src, i) => ({ html: `<img src="${src}" alt="${p.title} ảnh ${i + 1}">` }))
      : colorsOf(p).map((c) => ({ html: art(p, c), color: c }));
    if (!p.images.length) shot = colorsOf(p).indexOf(color);
    const orderMsg = `Chào shop, mình muốn đặt: ${p.title} (${p.code}) - Màu: ${color} - Size: ${size || "chưa chọn"} - Giá lẻ: ${vnd(p.price)}`;
    $("pdp").innerHTML = `
      <div class="gallery">
        <div class="main-img">${photos[shot].html}${p.images.length ? "" : `<span class="ph-note">Ảnh minh hoạ · thay bằng ảnh thật</span>`}</div>
        <div class="thumbs">${photos.map((ph, i) => `<button class="thumb ${i === shot ? "selected" : ""}" data-shot="${i}" ${ph.color ? `data-color="${ph.color}"` : ""} aria-label="Ảnh ${i + 1}">${ph.html}</button>`).join("")}</div>
      </div>
      <div class="buy">
        <span class="small">${p.product_type}</span>
        <h1>${p.title}</h1>
        <span class="code">Mã sản phẩm: ${p.code}</span>
        <div class="retail"><strong>${vnd(p.price)}</strong><span>Giá lẻ</span></div>

        <span class="label">Màu · ${color}</span>
        <div class="options">${colorsOf(p).map((c) => `<button class="swatch ${c === color ? "selected" : ""}" style="background:${p.swatches[c]}" data-color="${c}" aria-label="${c}" title="${c}"></button>`).join("")}</div>

        <span class="label">Kích cỡ</span>
        <div class="options">${p.options[1].values.map((s) => `<button class="size ${s === size ? "selected" : ""}" data-size="${s}">${s}</button>`).join("")}</div>

        <span class="label">Mô tả</span>
        <p class="desc">${p.body_html}</p>

        <div class="buy-actions">
          <button class="btn btn-ink" id="addToCart" ${variant ? "" : "disabled"}>${variant ? "Thêm vào giỏ" : "Chọn size để thêm"}</button>
          <a class="btn btn-zalo" ${zaloAttrs(orderMsg)}>Đặt hàng qua Zalo</a>
        </div>

        <div class="ws-box">
          <strong>Mua sỉ mẫu này?</strong>
          <p>Liên hệ chúng tôi để nhận giá sỉ và số lượng đặt tối thiểu.</p>
          <a class="btn btn-soft" ${zaloAttrs(`Chào shop, mình muốn hỏi giá sỉ mẫu ${p.title} (${p.code}).`)}>Liên hệ giá sỉ</a>
          <a class="link" href="#ban-si">Xem thông tin bán sỉ →</a>
        </div>
      </div>`;
  };
  $("pdp").onclick = (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.color) { color = t.dataset.color; render(); }
    else if (t.dataset.shot) { shot = Number(t.dataset.shot); render(); }
    else if (t.dataset.size) { size = t.dataset.size; render(); }
    else if (t.id === "addToCart") {
      const v = p.variants.find((x) => x.option1 === color && x.option2 === size);
      if (v) addToCart(v.id, 1);
    }
  };
  render();
}

/* ---------- Router: #ao-kieu, #ao-thun, #ao-so-mi, #ban-si, #sp-<handle> ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const cat = CATS.find((c) => c.slug === h);
  const product = h.startsWith("sp-") && PRODUCTS.find((p) => p.handle === h.slice(3));
  let current = "";
  if (product) { $("app").innerHTML = productPage(product); mountProduct(product); current = catOf(product).slug; }
  else if (cat) { $("app").innerHTML = categoryPage(cat); current = cat.slug; }
  else if (h === "ban-si") { $("app").innerHTML = wholesalePage(); current = "ban-si"; }
  else { $("app").innerHTML = homePage(); }
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === current));
  const target = h && !product && !cat && h !== "ban-si" && document.getElementById(h);
  if (target) target.scrollIntoView({ behavior: "auto" }); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Hover: cycle a card through its colors ---------- */
let cycleTimer;
document.addEventListener("mouseover", (e) => {
  const c = e.target.closest(".card");
  if (!c || reduceMotion || c.dataset.cycling) return;
  const p = PRODUCTS.find((x) => x.id === Number(c.dataset.id));
  if (!p || p.images.length || colorsOf(p).length < 2) return;
  document.querySelectorAll("[data-cycling]").forEach((b) => delete b.dataset.cycling);
  c.dataset.cycling = "1";
  let i = 0;
  clearInterval(cycleTimer);
  cycleTimer = setInterval(() => { i = (i + 1) % colorsOf(p).length; c.querySelector(".art").innerHTML = art(p, colorsOf(p)[i]); }, 800);
});
document.addEventListener("mouseout", (e) => {
  const c = e.target.closest(".card");
  if (!c || !c.dataset.cycling || c.contains(e.relatedTarget)) return;
  clearInterval(cycleTimer);
  delete c.dataset.cycling;
  const p = PRODUCTS.find((x) => x.id === Number(c.dataset.id));
  c.querySelector(".art").innerHTML = art(p, colorsOf(p)[0]);
});

/* ---------- Zalo buttons: copy the message, then open Zalo ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-copy]");
  if (!a) return;
  const msg = decodeURIComponent(a.dataset.copy || "");
  if (!SHOP.zalo) { showToast("Số Zalo của shop đang được cập nhật"); if (location.hash === "#lien-he") { e.preventDefault(); $("lien-he")?.scrollIntoView(); } closeCart(); return; }
  if (msg && navigator.clipboard) {
    navigator.clipboard.writeText(msg).then(() => showToast("Đã sao chép nội dung. Dán vào Zalo để gửi cho shop ♡")).catch(() => {});
  }
});

/* =====================================================================
   CART — lines are { variant_id, quantity }, same as Shopify's cart.
   In a Shopify theme, replace addToCart / setQty with:
     fetch('/cart/add.js',    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items:[{ id: variantId, quantity }] }) })
     fetch('/cart/change.js', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: variantId, quantity }) })
   ===================================================================== */
let cart = [];
try { cart = JSON.parse(localStorage.getItem("soi-cart-v5")) || []; } catch { cart = []; }
const saveCart = () => { try { localStorage.setItem("soi-cart-v5", JSON.stringify(cart)); } catch {} };

function addToCart(variantId, quantity) {
  const line = cart.find((l) => l.variant_id === variantId);
  if (line) line.quantity += quantity; else cart.push({ variant_id: variantId, quantity });
  saveCart(); renderCart();
  showToast(`Đã thêm ${findVariant(variantId).p.title} vào giỏ ♡`);
  $("cartBtn").classList.remove("bump"); void $("cartBtn").offsetWidth; $("cartBtn").classList.add("bump");
}
function setQty(variantId, quantity) {
  cart = cart.map((l) => l.variant_id === variantId ? { ...l, quantity } : l).filter((l) => l.quantity > 0);
  saveCart(); renderCart();
}

function renderCart() {
  cart = cart.filter((l) => findVariant(l.variant_id));
  const count = cart.reduce((n, l) => n + l.quantity, 0);
  const total = cart.reduce((n, l) => n + l.quantity * Number(findVariant(l.variant_id).v.price), 0);
  $("cartCount").textContent = count;
  $("cartTotal").textContent = vnd(total);

  const lines = cart.map((l) => { const { p, v } = findVariant(l.variant_id); return `- ${p.title} (${p.code}) · ${v.title} · SL ${l.quantity}`; });
  const msg = `Chào shop, mình muốn đặt hàng:\n${lines.join("\n")}\nTạm tính: ${vnd(total)}`;
  const btn = $("checkoutBtn");
  btn.setAttribute("href", count ? zaloHref() : "#");
  btn.dataset.copy = encodeURIComponent(msg);
  if (SHOP.zalo) { btn.target = "_blank"; btn.rel = "noopener"; }
  btn.style.opacity = count ? "" : ".4";
  btn.style.pointerEvents = count ? "" : "none";

  $("cartItems").innerHTML = cart.length === 0
    ? `<li class="empty">Giỏ hàng đang trống ♡</li>`
    : cart.map((l) => {
        const { p, v } = findVariant(l.variant_id);
        return `<li class="cart-item">
          <div class="cart-thumb">${p.images[0] ? `<img src="${p.images[0]}" alt="">` : art(p, v.option1)}</div>
          <div class="cart-meta">${p.title}<small>${v.title} · ${vnd(v.price)}</small></div>
          <div class="qty">
            <button data-id="${v.id}" data-q="${l.quantity - 1}" aria-label="Giảm">−</button>
            <span>${l.quantity}</span>
            <button data-id="${v.id}" data-q="${l.quantity + 1}" aria-label="Tăng">+</button>
          </div>
        </li>`;
      }).join("");
}
$("cartItems").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (b) setQty(Number(b.dataset.id), Number(b.dataset.q));
});

const openCart = () => { $("cartDrawer").hidden = false; $("overlay").hidden = false; };
function closeCart() { $("cartDrawer").hidden = true; $("overlay").hidden = true; }
$("cartBtn").addEventListener("click", openCart);
$("drawerClose").addEventListener("click", closeCart);
$("overlay").addEventListener("click", closeCart);

/* ---------- Floating Zalo ---------- */
const zf = $("zaloFloat");
zf.setAttribute("href", zaloHref());
zf.dataset.copy = encodeURIComponent("Chào shop, mình muốn hỏi về sản phẩm.");
if (SHOP.zalo) { zf.target = "_blank"; zf.rel = "noopener"; }

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}

route();
renderCart();
</script>
